name: Weekly D1 reseed

# OFAC publishes updates early in the week (usually Mon/Tue), so we reseed on
# Wednesday. The D1 free tier caps writes at 100k/day, which used to force a
# two-day split because a full raw-table reseed needed ~143k writes (rows plus
# secondary-index entries). The serving schema writes ~800, so one day is ample.
#
#   Wed 01:00 UTC -> pytest, download the snapshot, emit schema.sql + seed.sql,
#                    create ofac-YYYYMMDD, verify counts, swap the worker binding,
#                    record in worker/dbs.json, prune old databases
#
# The live database is never written in place: a failed seed can only strand the
# fresh DB, never corrupt serving data. The swap happens only after count
# verification passes, and a failed smoke test restores the previous binding.
#
# The worker code and the serving schema must be on the same ref — swap_db.py
# deploys from this checkout, so a new index.js against an old-schema database
# would 500 every endpoint.
#
# Required secret: CLOUDFLARE_API_TOKEN with Account D1 (edit) and
# Workers Scripts (edit). Pinned to wrangler v4 (config uses top-level
# d1_databases; nested d1.databases is rejected).

on:
  schedule:
    - cron: "0 1 * * 3"
  workflow_dispatch:
    inputs:
      stamp:
        description: "Reseed DB date stamp YYYYMMDD (default: today)"
        required: false
        default: ""

env:
  WRANGLER_VERSION: "4"

jobs:
  reseed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g "wrangler@${{ env.WRANGLER_VERSION }}"

      - name: Test
        run: |
          pip install pytest
          python3 -m pytest -v

      - name: Build snapshot + emit seed
        run: python3 scripts/build_seed.py seed

      - name: Stamp
        id: stamp
        run: |
          STAMP="${{ github.event.inputs.stamp }}"
          [ -z "$STAMP" ] && STAMP=$(date -u +%Y%m%d)
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"

      - name: Seed fresh database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          DB="ofac-${{ steps.stamp.outputs.stamp }}"
          wrangler d1 delete "$DB" -y || true
          wrangler d1 create "$DB"
          wrangler d1 execute "$DB" --remote --file=seed/schema.sql
          wrangler d1 execute "$DB" --remote --file=seed/seed.sql

      - name: Verify, swap binding, deploy, record, prune
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STAMP: ${{ steps.stamp.outputs.stamp }}
        run: python3 scripts/swap_db.py

      - name: Commit binding record
        env:
          STAMP: ${{ steps.stamp.outputs.stamp }}
        run: |
          git config user.name "ofac-reseed"
          git config user.email "ofac-reseed@users.noreply.github.com"
          git add worker/dbs.json worker/wrangler.jsonc
          git commit -m "Reseed: worker now serves ofac-$STAMP" || echo "nothing to commit"
          git push