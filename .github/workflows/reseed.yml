name: Weekly D1 reseed

# OFAC publishes updates early in the week (usually Mon/Tue), so we reseed
# mid-week across TWO UTC days: the D1 free tier caps writes at 100k/day
# and a full reseed needs ~143k (rows + secondary-index entries).
#
#   Wed 01:00 UTC -> part 1: fresh DB ofac-YYYYMMDD, schema + entities + countries
#   Thu 01:00 UTC -> part 2: programs + lists + meta, verify counts, swap
#                    the worker binding, record in worker/dbs.json, prune old DBs
#
# The live database is never written in place: a capped or failed seed can
# only strand the fresh DB, never corrupt serving data. The swap happens
# only after count verification passes.
#
# Required secret: CLOUDFLARE_API_TOKEN with Account D1 (edit) and
# Workers Scripts (edit). Pinned to wrangler v4 (config uses top-level
# d1_databases; nested d1.databases is rejected).

on:
  schedule:
    - cron: "0 1 * * 3"
    - cron: "0 1 * * 4"
  workflow_dispatch:
    inputs:
      stamp:
        description: "Reseed DB date stamp YYYYMMDD (default: most recent Wednesday)"
        required: false
        default: ""

env:
  WRANGLER_VERSION: "4"

jobs:
  part1:
    if: github.event.schedule == '0 1 * * 3' || (github.event_name == 'workflow_dispatch' && github.event.inputs.stamp == '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g "wrangler@${{ env.WRANGLER_VERSION }}"
      - name: Build snapshot + split seed
        run: python3 scripts/build_seed.py seed
      - name: Stamp
        id: stamp
        run: echo "stamp=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Seed fresh database (part 1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          DB="ofac-${{ steps.stamp.outputs.stamp }}"
          wrangler d1 delete "$DB" -y || true
          wrangler d1 create "$DB"
          wrangler d1 execute "$DB" --remote --file=seed/schema.sql
          wrangler d1 execute "$DB" --remote --file=seed/part1.sql
      - uses: actions/upload-artifact@v7
        with:
          name: seed-${{ steps.stamp.outputs.stamp }}
          retention-days: 7
          path: |
            seed/part2.sql
            seed/counts.json
            seed/part1.date

  part2:
    if: github.event.schedule == '0 1 * * 4' || (github.event_name == 'workflow_dispatch' && github.event.inputs.stamp != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g "wrangler@${{ env.WRANGLER_VERSION }}"
      - name: Stamp (most recent Wednesday, or manual input)
        id: stamp
        run: |
          if [ -n "${{ github.event.inputs.stamp }}" ]; then
            echo "stamp=${{ github.event.inputs.stamp }}" >> "$GITHUB_OUTPUT"
          else
            echo "stamp=$(date -u -d 'last wednesday' +%Y%m%d)" >> "$GITHUB_OUTPUT"
          fi
      - name: Find part1 run holding the seed artifact
        id: part1run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STAMP="${{ steps.stamp.outputs.stamp }}"
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=seed-${STAMP}" \
            --paginate -q '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "No non-expired artifact found for seed-${STAMP}; listing candidates:"
            gh api "repos/${{ github.repository }}/actions/artifacts?name=seed-${STAMP}" \
              --paginate -q '.artifacts[] | "\(.name) run=\(.workflow_run.id) expired=\(.expired) created=\(.created_at)"' || true
            exit 1
          fi
          echo "Using seed-${STAMP} from run ${RUN_ID}"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: seed-${{ steps.stamp.outputs.stamp }}
          path: seed
          github-token: ${{ github.token }}
          run-id: ${{ steps.part1run.outputs.run_id }}
      - name: Seed part 2 (day-separated guard)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/apply_part2.py "ofac-${{ steps.stamp.outputs.stamp }}" seed
      - name: Verify, swap binding, deploy, record, prune
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STAMP: ${{ steps.stamp.outputs.stamp }}
        run: python3 scripts/swap_db.py
      - name: Commit binding record
        run: |
          git config user.name "ofac-reseed"
          git config user.email "ofac-reseed@users.noreply.github.com"
          git add worker/dbs.json worker/wrangler.jsonc
          git commit -m "Reseed: worker now serves ofac-$STAMP" || echo "nothing to commit"
          git push
        env:
          STAMP: ${{ steps.stamp.outputs.stamp }}
